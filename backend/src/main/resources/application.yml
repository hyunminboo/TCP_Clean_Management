spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tcp_clean_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: tcp_user
    password: tcp_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: localhost
      port: 6379
      password: redispass

jwt:
  # 최소 256비트(32자) 이상의 비밀키
  secret: tcp-clean-management-secret-key-2026-very-secure-jwt-key-for-b2b-dashboard
  expiration-minutes: 480

